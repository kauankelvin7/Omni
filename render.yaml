# Render Blueprint for a NEW Omni deployment.
# Existing services preserve old environment variables when syncing:
# remove legacy non-JDBC SPRING_DATASOURCE_URL and inspect a DB backup
# before opting in to Flyway baseline on an already populated database.
services:
  - type: web
    name: omni-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_JWT_SECRET
        generateValue: true
      - key: MASTER_EMAIL
        sync: false
      - key: MASTER_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: omni-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: omni-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: omni-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: omni-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: omni-postgres
          property: password

  - type: web
    name: omni-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: omni-postgres
    plan: free
