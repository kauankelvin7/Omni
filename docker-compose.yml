version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: omnib2b-postgres
    environment:
      POSTGRES_USER: omni_user
      POSTGRES_PASSWORD: omni_password
      POSTGRES_DB: omni_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    restart: unless-stopped
