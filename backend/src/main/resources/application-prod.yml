spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/omni_db}
    username: ${DATABASE_USER:omni_user}
    password: ${DATABASE_PASSWORD:omni_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

master:
  jwt-secret: ${MASTER_JWT_SECRET:${JWT_SECRET}}
  email: ${MASTER_EMAIL}
  password: ${MASTER_PASSWORD}
