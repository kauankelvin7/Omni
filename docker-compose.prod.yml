version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omni_db}
      POSTGRES_USER: ${POSTGRES_USER:-omni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private production DB password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - omni-network

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-omni_db}
      DB_USER: ${POSTGRES_USER:-omni_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set a private production DB password}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      MASTER_JWT_SECRET: ${MASTER_JWT_SECRET:?Set a separate MASTER_JWT_SECRET}
      MASTER_PASSWORD: ${MASTER_PASSWORD:?Set MASTER_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - omni-network

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - omni-network

volumes:
  pgdata:

networks:
  omni-network:
    driver: bridge
