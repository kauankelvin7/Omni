name: Backend tenant security

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "bots/**"
      - "render.yaml"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-tenant-security.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni_user
          POSTGRES_PASSWORD: omni_password
          POSTGRES_DB: omni_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni_user -d omni_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/omni_db
      SPRING_DATASOURCE_USERNAME: omni_user
      SPRING_DATASOURCE_PASSWORD: omni_password
      JWT_SECRET: test-only-not-for-deployment-0123456789abcdef0123456789abcdef
      MASTER_PASSWORD: test-only-master-password
      SEED_SECRET: test-only-seed-secret
      ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Execute backend tests against PostgreSQL
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean verify
  legacy-schema-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni_user
          POSTGRES_PASSWORD: omni_password
          POSTGRES_DB: omni_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni_user -d omni_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/omni_db
      SPRING_DATASOURCE_USERNAME: omni_user
      SPRING_DATASOURCE_PASSWORD: omni_password
      JWT_SECRET: test-only-not-for-deployment-0123456789abcdef0123456789abcdef
      MASTER_PASSWORD: test-only-master-password
      SEED_SECRET: test-only-seed-secret
      ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install PostgreSQL client and populate legacy schema
        working-directory: .
        env:
          PGPASSWORD: omni_password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U omni_user -d omni_db -f docker/postgres/init.sql
      - name: Verify explicit Flyway baseline and legacy upgrade
        env:
          FLYWAY_BASELINE_ON_MIGRATE: "true"
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean verify
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and typecheck/build frontend
        run: |
          npm ci
          npm run build

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all bot modules
        run: python -m compileall -q bots
      - name: Install bot dependencies
        run: python -m pip install -r bots/requirements.txt
      - name: Run standard-library bot regression tests
        run: python -m unittest discover -s bots/tests -p 'test_*.py' -v

