name: Backend tenant security

on:
  push:
    branches:
      - fix/tenant-isolation-and-db-config
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-tenant-security.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni_user
          POSTGRES_PASSWORD: omni_password
          POSTGRES_DB: omni_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni_user -d omni_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/omni_db
      SPRING_DATASOURCE_USERNAME: omni_user
      SPRING_DATASOURCE_PASSWORD: omni_password
      JWT_SECRET: test-only-not-for-deployment-0123456789abcdef0123456789abcdef
      MASTER_PASSWORD: test-only-master-password
      SEED_SECRET: test-only-seed-secret
      ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Execute backend tests against PostgreSQL
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress clean verify
